name: Build Android (APK)

on:
  workflow_dispatch: {}        # botón manual en la pestaña Actions
  push:
    tags:
      - 'v*'                   # también al crear un tag tipo v1.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TIENE_FIRMA: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      # Firma: la misma keystore que ComparaPrecios (mismos 4 Secrets, hay que
      # copiarlos a este repo: Settings > Secrets and variables > Actions).
      # Sin Secrets compila igual, pero con firma de depuración: cada APK
      # tendría una firma distinta y no se podría instalar encima del anterior.
      - name: Restaurar keystore
        if: env.TIENE_FIRMA == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks
          cat > android/key.properties <<EOP
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore.jks
          EOP

      - name: Aviso sin firma
        if: env.TIENE_FIRMA != 'true'
        run: echo "::warning::Faltan los Secrets de firma. El APK sale con firma de depuracion."

      - name: Dependencias
        run: flutter pub get

      # Revisión rápida del código: si hay errores se ven aquí en 1-2 min.
      - name: Analizar
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Renombrar
        run: cp build/app/outputs/flutter-apk/app-release.apk GluControl.apk

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: glucontrol-apk
          path: GluControl.apk
          if-no-files-found: error
