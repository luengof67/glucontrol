name: glucontrol
description: GluControl — control de diabetes (glucemia, HbA1c, medicación, alimentación). Android + Windows, sincronizado con Firebase.
publish_to: 'none'
version: 10.0.0+10

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  intl: any # la versión la fija flutter_localizations
  flutter_secure_storage: ^11.2.0 # la 11 usa win32 6, como share_plus 13
  http: ^1.2.2
  image: ^4.1.0
  image_picker: ^1.1.2
  file_selector: ^1.0.3
  path_provider: ^2.1.4
  pdf: ^3.11.1
  printing: ^5.13.2
  share_plus: ^13.3.0
  url_launcher: ^6.3.1
  flutter_local_notifications: ^22.3.3 # la 23 exige compileSdk 37 y AGP 9.1
  timezone: ^0.11.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/fuentes/
    - assets/icono.png
